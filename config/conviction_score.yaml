# Conviction Score: a single 0-100 number per stock, deliberately built from
# just two basic, already-simple checklists - not a naive average of
# everything the pipeline computes. Matches the aggregation design this
# project settled on (see README's "Layered analysis" section): the
# checklist pass-rates form a weighted BASE quality score, then the
# qualitative moat read and the Graham Number valuation gate each MULTIPLY
# that base rather than blending into it - so a strong checklist score
# can't quietly outvote "no durable moat found" or "no margin of safety at
# this price." A component only contributes to the base score when it
# actually has data; weights renormalize over whatever's available rather
# than penalizing a stock for a checklist this pipeline couldn't evaluate
# (missing statement years, etc.).

component_weights:
  graham_pct: 0.5 # Graham Defensive Investor checklist pass rate (assets vs liabilities, earnings, price)
  piotroski_pct: 0.5 # Piotroski F-Score pass rate (year-over-year balance-sheet/profitability checks)

# Applied AFTER the weighted base score above, as a multiplier - deliberately
# not blended in as a 3rd weighted component, so it can meaningfully move
# the outcome regardless of how strong the checklists look.
qualitative_moat_multiplier:
  moat_present: 1.05
  no_moat: 0.70
  not_evaluated: 1.0 # qualitative layer didn't run (quant gate failed, or errored) - nothing to penalize

# The final gate: a wonderful business at a bad price still isn't a buy.
# valuation_gate_pass here is pipeline.scoring.aggregation's own risk-scaled
# gate (required_margin_of_safety_pct) against the Graham Number - a plain
# sqrt(22.5 x EPS x book value per share) formula, not a projection model.
valuation_gate_multiplier:
  pass: 1.0
  fail: 0.55
  not_evaluated: 1.0

# 0-100 -> a plain-language verdict label (moved here from the retired
# scoring_weights.yaml, since the Conviction Score is now the only score
# this pipeline computes).
verdict_bands:
  - {min: 75, label: Strong}
  - {min: 60, label: Favorable}
  - {min: 40, label: Neutral}
  - {min: 25, label: Cautious}
  - {min: 0, label: Weak}

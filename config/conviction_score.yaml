# The Investment Meter: a single 0-100 number per stock, built from exactly
# three investors - Graham, Buffett, Munger - and nothing else. Graham's own
# Defensive Investor checklist pass rate is the base score; Buffett's moat
# read, Munger's quality checklist, and Graham's own valuation gate each
# MULTIPLY that base rather than blending into it (deliberately not a naive
# average - see README's "Investment Meter" section), so a strong checklist
# score can't quietly paper over "no durable moat," "earns poor returns on
# capital," or "no margin of safety at this price."

# Buffett's economic-moat read (pipeline/narrative/qualitative_client.py,
# reading the company's own 10-K).
buffett_moat_multiplier:
  moat_present: 1.05
  no_moat: 0.70
  not_evaluated: 1.0 # qualitative layer didn't run (quant gate failed, or errored) - nothing to penalize

# Munger's quality checklist (pipeline/scoring/value_investing.py::munger_quality_checklist) -
# return on equity, debt discipline, no dilution, stable margins. Munger's
# own point: a business that earns strong, durable returns on capital is
# worth more than statistical cheapness alone would suggest - and the
# reverse is a warning, not just a wash.
munger_quality_multiplier:
  quality_present: 1.10
  quality_absent: 0.75
  not_evaluated: 1.0

# The final gate: a wonderful business at a bad price still isn't a buy.
# valuation_gate_pass is the Graham Number margin of safety
# (pipeline.scoring.aggregation.REQUIRED_MARGIN_OF_SAFETY_PCT) against a
# plain sqrt(22.5 x EPS x book value per share) formula, not a projection.
graham_valuation_multiplier:
  pass: 1.0
  fail: 0.55
  not_evaluated: 1.0

# 0-100 -> a plain-language verdict label.
verdict_bands:
  - {min: 75, label: Strong}
  - {min: 60, label: Favorable}
  - {min: 40, label: Neutral}
  - {min: 25, label: Cautious}
  - {min: 0, label: Weak}

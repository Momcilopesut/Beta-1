# Layer 2 (quant screen) pass/fail thresholds - a fast, deterministic
# filter, deliberately separate from the Conviction Score in
# conviction_score.yaml. This gate answers a narrower question first: does
# the company clear a baseline balance-sheet/cash-flow safety bar at all,
# before spending the expensive qualitative layer on it.
#
# Deliberately balance-sheet-and-cash only (no growth projections, no ROIC's
# multi-input tax-rate math) - "does this company own more than it owes,
# and is it generating real cash," basic arithmetic anyone can check against
# the raw financial statements.
#
# Each metric: higher_is_better (or lower_is_better) + a pass threshold.
# A metric with no data for a company is excluded from that company's
# evaluated/passed count entirely (never counted as a fail).

metrics:
  current_ratio:
    label: "Current ratio (current assets / current liabilities)"
    higher_is_better: true
    threshold: 1.5
    rationale: "Can short-term assets cover short-term debts? The most basic assets-vs-liabilities check."
  debt_to_ebitda:
    label: "Debt / EBITDA"
    higher_is_better: false
    threshold: 3.0
    rationale: "Balance-sheet discipline - a Graham-style safety check."
  fcf_margin_pct:
    label: "Free cash flow margin"
    higher_is_better: true
    threshold: 10.0
    rationale: "Real cash coming in, not just accounting profit."

# Evaluated-but-not-gating: shown in the scorecard for context, never
# counted toward passed/evaluated.
informational_metrics:
  - margin_trend_score

# Fraction of evaluated metrics that must pass for the overall gate to pass
# (with 3 metrics, this means at least 2 of 3).
gate_pass_fraction: 0.6

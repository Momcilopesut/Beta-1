<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Lookup</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Stock Lookup</h1>
    <p class="meta">Free price + news data, summarized locally by your own LM Studio model. Nothing leaves your computer.</p>
  </header>
  <main>
    <form id="search-form" autocomplete="off">
      <input id="ticker-input" type="text" placeholder="Enter a ticker, e.g. AAPL" />
      <button type="submit">Look up</button>
    </form>
    <p id="status" class="status"></p>
    <div id="result"></div>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

name: Weekly screen

on:
  schedule:
    # Friday 21:30 UTC = 17:30 EDT / 16:30 EST - genuinely "Friday, after
    # the ~4pm ET market close" year-round regardless of DST, with a
    # buffer for end-of-day price data to be final. This is now the
    # program's primary run: a two-phase screen (cheap quant+checklist pass
    # over the whole curated universe in config/watchlist.yaml, then AI
    # enrichment of just the top_n_per_sector finalists - see
    # pipeline/main.py's module docstring) that produces each week's top
    # picks per sector.
    - cron: "30 21 * * 5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to run (default: full screening universe)"
        required: false
      dry_run:
        description: "Write to data/.dry-run instead of committing/deploying"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-screen
  cancel-in-progress: false

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly screen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m pipeline.main $ARGS

      - name: Commit updated data
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated weekly screen $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Guard against a rejected push if another run's commit landed
            # in between (e.g. an overlapping manual re-run).
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Prepare Pages content
        if: github.event.inputs.dry_run != 'true'
        run: |
          # Preserve site/ and data/ as siblings (matching local dev) so
          # site/js/*.js's `../data/...` fetches resolve correctly once
          # deployed under GitHub Pages' /<repo>/ path prefix. Flattening
          # site/'s contents into the artifact root breaks that path by one
          # directory level.
          mkdir -p _site
          cp -r site _site/site
          cp -r data _site/data
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=site/index.html">' \
            '<a href="site/index.html">Continue to the dashboard</a>' \
            > _site/index.html

      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event.inputs.dry_run != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
